<div class="space-y-6 animate-fade-in">
  <!-- Admin Header Banner -->
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center bg-slate-900 text-white p-6 rounded-xl border border-slate-800 shadow-md relative overflow-hidden shrink-0">
    <div class="absolute -right-16 -top-16 w-48 h-48 rounded-full bg-[#FF6C37] opacity-10 blur-xl"></div>
    <div class="space-y-1 relative z-10">
      <h1 class="text-xl font-bold tracking-tight">Khu vực quản trị hệ thống (Admin Console)</h1>
      <p class="text-slate-400 text-xs font-light">Quản lý ngân hàng câu hỏi tự luận, cấu hình Ontology chấm điểm, thiết lập ma trận sinh đề và theo dõi học tập.</p>
    </div>
    
    <a routerLink="/" class="mt-4 md:mt-0 bg-[#FF6C37] hover:bg-orange-600 text-white px-4 py-2 rounded-lg text-xs font-bold transition-all relative z-10 shadow-sm shrink-0 flex items-center space-x-1.5 cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
      </svg>
      <span>Trang chủ</span>
    </a>
  </div>

  <!-- Tabs Navigation -->
  <div class="border-b border-slate-200 flex space-x-2 overflow-x-auto shrink-0 bg-white rounded-t-xl border-t border-x px-4 pt-1 shadow-sm">
    <button (click)="changeTab('questions')"
      [class]="activeTab() === 'questions' ? 'border-b-2 border-[#FF6C37] text-[#FF6C37] font-bold py-2.5 px-4 text-sm transition-all shrink-0 cursor-pointer' : 'border-b-2 border-transparent text-slate-500 hover:text-slate-900 py-2.5 px-4 text-sm transition-all shrink-0 cursor-pointer'">
      Ngân hàng câu hỏi
    </button>
    <button (click)="changeTab('matrix')"
      [class]="activeTab() === 'matrix' ? 'border-b-2 border-[#FF6C37] text-[#FF6C37] font-bold py-2.5 px-4 text-sm transition-all shrink-0 cursor-pointer' : 'border-b-2 border-transparent text-slate-500 hover:text-slate-900 py-2.5 px-4 text-sm transition-all shrink-0 cursor-pointer'">
      Ma trận sinh đề thi
    </button>
    <button (click)="changeTab('analytics')"
      [class]="activeTab() === 'analytics' ? 'border-b-2 border-[#FF6C37] text-[#FF6C37] font-bold py-2.5 px-4 text-sm transition-all shrink-0 cursor-pointer' : 'border-b-2 border-transparent text-slate-500 hover:text-slate-900 py-2.5 px-4 text-sm transition-all shrink-0 cursor-pointer'">
      Thống kê & Lịch sử học viên
    </button>
  </div>

  <!-- Dynamic Subcomponents -->
  <div class="p-6 bg-white border-x border-b border-slate-200 rounded-b-xl shadow-sm">
    @if (activeTab() === 'questions') {
      <app-question-bank></app-question-bank>
    }
    @if (activeTab() === 'matrix') {
      <app-exam-matrix></app-exam-matrix>
    }
    @if (activeTab() === 'analytics') {
      <app-student-analytics></app-student-analytics>
    }
  </div>
</div>
